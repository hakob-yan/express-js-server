services:
  redis: 
    image: redis:latest
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
  postgres_db:
    image: postgres:15-alpine
    container_name: my_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-my_database}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The healthcheck tests if Postgres is genuinely ready
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-postgres}", "-d", "${DB_NAME:-my_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_server:
    build: .
    container_name: my_api_server
    restart: always
    ports:
      - "80:3000"
    # Mounts your local code into the container so changes reflect instantly via nodemon
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_HOST: postgres_db
      APP_HOST: "0.0.0.0"
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-my_database}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-your-secret-key}
    depends_on:
      postgres_db:
        condition: service_healthy # Node waits until the healthcheck passes

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local